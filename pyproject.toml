[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-future-sdk"
version = "0.1.0"
description = "Python SDK for Binance Futures API"
readme = "README.md"

license = {file = "LICENSE"}
requires-python = ">=3.12.10"
dependencies = [
    "requests>=2.34",
    "pydantic>=2.0",
    "pandas>=2.3.2"
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-mock>=3.14.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0.2"
addopts = "-ra -q"
testpaths = [
    "tests"
]
pythonpath = ["src"]
markers = [
    "unit: Core isolated unit tests using mocks.",
    "integration: Tests that interact with the live Windows OS or network dependencies."
]